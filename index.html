<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edenspace Oy</title>
    <link href="https://fonts.googleapis.com/css?family=Inconsolata|Libre+Barcode+128+Text" rel="stylesheet">
    <style>
        :root{
            --bg: #000;
            --fg: #fff;
            --muted: #e6e6e6;
            --max-width: 900px; /* maximum content width */
            --footer-height: 84px; /* fixed footer height */
            --footer-logo-h: 56px; /* fixed footer logo height (does NOT scale) */
        }

        html,body{height:100%;margin:0}
        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:stretch;
            background:var(--bg);
            color:var(--fg);
            font-family: "Inconsolata", monospace;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            /* fluid base font size */
            font-size: clamp(16px, 1.6vw, 18px);
        }

        main.hero{
            flex:1 0 auto;
            display:flex;
            align-items:center;
            justify-content:center;
            padding: clamp(1rem, 6vw, 2.5rem) 1rem;
        }

        .content{
            width: min(92vw, var(--max-width));
            text-align:center;
        }

        /* logo text (non-semantic div, not bold) */
        .logo-text{
            margin:0;
            font-family: 'Libre Barcode 128 Text', monospace;
            /* allow EDENSPACE to grow almost full width on narrow screens */
            font-size: clamp(2.8rem, 22vw, 8rem);
            line-height:1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400; /* explicitly not bold */
        }

        .tagline{
            margin-top: clamp(.5rem, 1.6vw, .85rem);
            color: var(--muted);
            font-size: clamp(1rem, 2.4vw, 1.25rem);
        }

        .contact{
            /* more space above the email */
            margin-top: clamp(1rem, 4vw, 1.5rem);
            display:flex;
            flex-direction:column;
            gap: clamp(.15rem, .8vw, .4rem);
            align-items:center;
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            color: var(--muted);
        }

        .contact a{ color:inherit; text-decoration:none }

        footer.site-footer{
            height: var(--footer-height);
            display:flex;
            align-items:center;
            justify-content:center;
            background: rgba(0,0,0,0.9);
            flex-shrink:0;
        }

        /* Footer image is fixed size and does NOT scale */
        .site-footer .reliable-partner img{
            height: var(--footer-logo-h);
            width: auto;
            display:block;
            opacity: 0;
            animation: fade-up .9s ease-out 1.7s forwards;
        }

        /* --- animations --- */
        @keyframes reveal {
            from { clip-path: inset(0 100% 0 0); }
            to   { clip-path: inset(0 0 0 0); }
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 0.78;
                text-shadow: 0 0 0 rgba(255,255,255,0);
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 14px rgba(255,255,255,0.22);
            }
        }
        @keyframes blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .logo-wrap{
            position: relative;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
        }
        .logo-text{
            animation: reveal 1.3s cubic-bezier(.2,.7,.2,1) .15s both;
            will-change: clip-path;
        }
        /* per-letter breathing wave — slow light flowing through the barcode */
        .logo-text .bar{
            display: inline-block;
            animation: pulse 7s ease-in-out infinite;
            animation-delay: calc(var(--i, 0) * -0.45s);
        }

        .tagline{
            opacity: 0;
            animation: fade-up .8s ease-out 1.0s forwards;
        }
        .cursor{
            display: inline-block;
            width: .5ch;
            height: 1em;
            background: var(--muted);
            vertical-align: -0.12em;
            margin-left: .35ch;
            animation: blink 1.1s steps(1) infinite;
        }

        .contact{
            opacity: 0;
            animation: fade-up .8s ease-out 1.3s forwards;
        }
        .contact a{
            position: relative;
            display: inline-block;
        }
        .contact a::after{
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -2px;
            height: 1px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform .4s cubic-bezier(.2,.7,.2,1);
        }
        .contact a:hover::after,
        .contact a:focus-visible::after{
            transform: scaleX(1);
        }

        @media (prefers-reduced-motion: reduce){
            .logo-text,
            .logo-text .bar,
            .logo-text .bar.is-glitching,
            .tagline,
            .contact,
            .cursor,
            .site-footer .reliable-partner img{
                animation: none;
            }
            .logo-text,
            .tagline,
            .contact,
            .site-footer .reliable-partner img{
                opacity: 1;
                clip-path: none;
                transform: none;
            }
            .contact a::after{ transition: none; }
        }

    </style>
</head>
<body>
    <main class="hero" role="main">
        <div class="content">
            <div class="logo-wrap">
                <div class="logo-text">EDENSPACE</div>
            </div>
            <div class="tagline">a software development company<span class="cursor" aria-hidden="true"></span></div>
            <div class="contact" aria-label="contact details">
                <div><a href="mailto:contact@edenspace.fi">contact@edenspace.fi</a></div>
                <div>2656910-7</div>
            </div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="reliable-partner" aria-hidden="false">
            <img src="luotettava-kumppani-logo-white.png" alt="Luotettava kumppani">
        </div>
    </footer>

    <script>
        (function(){
            var logo = document.querySelector('.logo-text');
            if(!logo) return;
            var text = logo.textContent;
            logo.setAttribute('aria-label', text);
            logo.innerHTML = text.split('').map(function(c, i){
                return '<span class="bar" style="--i:' + i + '" aria-hidden="true">' + c + '</span>';
            }).join('');
        })();
    </script>
</body>
</html>
