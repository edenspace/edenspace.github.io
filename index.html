<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edenspace Oy</title>
    <link href="https://fonts.googleapis.com/css?family=Inconsolata|Libre+Barcode+128+Text" rel="stylesheet">
    <style>
        :root{
            --bg: #000;
            --fg: #fff;
            --muted: #e6e6e6;
            --max-width: 900px;
            --footer-height: 84px;
            --footer-logo-h: 56px;
        }

        html,body{height:100%;margin:0}
        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:stretch;
            background:var(--bg);
            color:var(--fg);
            font-family: "Inconsolata", monospace;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            font-size: clamp(16px, 1.6vw, 18px);
        }

        main.hero{
            flex:1 0 auto;
            display:flex;
            align-items:center;
            justify-content:center;
            padding: clamp(1rem, 6vw, 2.5rem) 1rem;
        }

        .content{
            width: min(92vw, var(--max-width));
            text-align:center;
        }

        /* logo */
        .logo-wrap{
            display: inline-block;
            max-width: 100%;
        }
        .logo-text{
            margin: 0;
            font-family: 'Libre Barcode 128 Text', monospace;
            font-size: clamp(2.8rem, 22vw, 8rem);
            line-height: 1;
            white-space: nowrap;
            font-weight: 400;
            /* cursor lives on the right edge of the logo, which is also the
               typing edge since chars are appended */
            border-right: 0.18ch solid transparent;
            min-height: 1em;
        }
        .logo-text.is-typing{
            border-right-color: var(--muted);
        }
        .logo-text.is-pending,
        .logo-text.is-blinking{
            animation: blink 1.1s steps(1) infinite;
        }
        /* per-letter breathing wave — slow light flowing through the barcode */
        .logo-text .bar{
            display: inline-block;
            animation: pulse 7s ease-in-out infinite;
            animation-delay: calc(var(--i, 0) * -0.45s);
        }

        .tagline{
            color: var(--muted);
            font-size: clamp(1rem, 2.4vw, 1.25rem);
        }

        /* empty line between sections — the cursor stops here as if
           Enter had been pressed */
        .break-line{
            font-size: clamp(1rem, 2.4vw, 1.25rem);
            line-height: 1;
            color: var(--muted);
        }

        .contact{
            display:flex;
            flex-direction:column;
            gap: clamp(.15rem, .8vw, .4rem);
            align-items:center;
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            color: var(--muted);
        }

        .contact a{
            color:inherit;
            text-decoration:none;
            position: relative;
            display: inline-block;
        }
        .contact a::after{
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -2px;
            height: 1px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform .4s cubic-bezier(.2,.7,.2,1);
        }
        .contact a:hover::after,
        .contact a:focus-visible::after{
            transform: scaleX(1);
        }

        footer.site-footer{
            height: var(--footer-height);
            display:flex;
            align-items:center;
            justify-content:center;
            background: rgba(0,0,0,0.9);
            flex-shrink:0;
        }
        .site-footer .reliable-partner img{
            height: var(--footer-logo-h);
            width: auto;
            display:block;
            opacity: 0;
            transition: opacity .9s ease-out;
        }
        .site-footer .reliable-partner img.is-visible{
            opacity: 1;
        }

        /* typed lines (tagline, email, bizid, end). Each grows as an
           inline-block centered in its parent — so the text stays centered
           at every step of typing. */
        .typed{
            display: inline-block;
            white-space: nowrap;
            vertical-align: middle;
            border-right: 0.2ch solid transparent;
            line-height: 1;
            min-height: 1em;
        }
        /* zero-width space ensures a line box exists even when empty so the
           cursor (border-right) renders at full height */
        .typed::before{
            content: '\200B';
        }
        .typed.is-typing{
            border-right-color: var(--muted);
        }
        .typed.is-pending,
        .typed.is-blinking{
            animation: blink 1.1s steps(1) infinite;
        }

        /* --- animations --- */
        @keyframes pulse {
            0%, 100% {
                opacity: 0.78;
                text-shadow: 0 0 0 rgba(255,255,255,0);
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 14px rgba(255,255,255,0.22);
            }
        }
        @keyframes blink {
            0%, 50%   { border-right-color: var(--muted); }
            51%, 100% { border-right-color: transparent; }
        }

        @media (prefers-reduced-motion: reduce){
            .logo-text,
            .logo-text .bar,
            .typed{
                animation: none;
            }
            .typed,
            .logo-text{
                border-right-color: transparent;
            }
            .site-footer .reliable-partner img{
                opacity: 1;
                transition: none;
            }
            .contact a::after{ transition: none; }
        }
    </style>
</head>
<body>
    <main class="hero" role="main">
        <div class="content">
            <div class="logo-wrap">
                <div class="logo-text" aria-label="EDENSPACE"></div>
            </div>
            <div class="break-line" aria-hidden="true">
                <span class="typed" data-typed="break1"></span>
            </div>
            <div class="tagline">
                <span class="typed" data-typed="tagline"></span>
            </div>
            <div class="break-line" aria-hidden="true">
                <span class="typed" data-typed="break2"></span>
            </div>
            <div class="contact" aria-label="contact details">
                <div>
                    <a href="mailto:contact@edenspace.fi">
                        <span class="typed" data-typed="email"></span>
                    </a>
                </div>
                <div>
                    <span class="typed" data-typed="bizid"></span>
                </div>
                <div>
                    <span class="typed" data-typed="end" aria-hidden="true"></span>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="reliable-partner" aria-hidden="false">
            <img src="luotettava-kumppani-logo-white.png" alt="Luotettava kumppani">
        </div>
    </footer>

    <script>
        (function(){
            var LOGO    = 'EDENSPACE';
            var TAGLINE = 'a software development company';
            var EMAIL   = 'contact@edenspace.fi';
            var BIZID   = '2656910-7';

            var logo    = document.querySelector('.logo-text');
            var break1  = document.querySelector('[data-typed="break1"]');
            var tagline = document.querySelector('[data-typed="tagline"]');
            var break2  = document.querySelector('[data-typed="break2"]');
            var email   = document.querySelector('[data-typed="email"]');
            var bizid   = document.querySelector('[data-typed="bizid"]');
            var endLine = document.querySelector('[data-typed="end"]');
            var footer  = document.querySelector('.site-footer .reliable-partner img');

            var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if(reduced){
                logo.innerHTML = LOGO.split('').map(function(c, i){
                    return '<span class="bar" style="--i:' + i + '" aria-hidden="true">' + c + '</span>';
                }).join('');
                tagline.textContent = TAGLINE;
                email.textContent   = EMAIL;
                bizid.textContent   = BIZID;
                footer.classList.add('is-visible');
                return;
            }

            // --- skip mechanism ------------------------------------------
            // Any key press (or tap) fast-forwards the current step to its
            // finished state. Mash the keyboard to reveal everything at once.
            var activeSkip = null;   // fn that completes the running step now
            var pendingSkips = 0;    // skips requested before a step started

            function requestSkip(){
                if(activeSkip){
                    var fn = activeSkip;
                    activeSkip = null;
                    fn();
                } else {
                    pendingSkips++;
                }
            }
            window.addEventListener('keydown', requestSkip);
            window.addEventListener('pointerdown', requestSkip);

            // Runs one animated step. `run(finish)` starts the animation and
            // must call finish() when done naturally; it returns a cleanup fn
            // that cancels any pending timers. `complete` (optional) snaps the
            // step's content straight to its finished state when skipped.
            function step(run, complete){
                return new Promise(function(resolve){
                    var done = false;
                    var cleanup = null;
                    function finish(){
                        if(done) return;
                        done = true;
                        if(cleanup) cleanup();
                        activeSkip = null;
                        resolve();
                    }
                    function skip(){
                        if(done) return;
                        done = true;
                        if(cleanup) cleanup();
                        if(complete) complete();
                        activeSkip = null;
                        resolve();
                    }
                    cleanup = run(finish);
                    activeSkip = skip;
                    // honor a skip that was queued before this step began
                    if(pendingSkips > 0){
                        pendingSkips--;
                        skip();
                    }
                });
            }

            function wait(ms){
                var t;
                return step(function(finish){
                    t = setTimeout(finish, ms);
                    return function(){ clearTimeout(t); };
                });
            }

            function barSpan(c, i){
                return '<span class="bar" style="--i:' + i + '" aria-hidden="true">' + c + '</span>';
            }

            // type EDENSPACE — cursor blinks on empty centered line, then
            // bars stream in, growing outward from center
            function typeLogo(){
                var t;
                return step(function(finish){
                    logo.classList.add('is-pending');
                    var i = 0;
                    function tick(){
                        if(i >= LOGO.length){
                            logo.classList.remove('is-typing');
                            finish();
                            return;
                        }
                        logo.insertAdjacentHTML('beforeend', barSpan(LOGO.charAt(i), i));
                        i++;
                        t = setTimeout(tick, 95 + Math.random() * 80);
                    }
                    t = setTimeout(function(){
                        logo.classList.remove('is-pending');
                        logo.classList.add('is-typing');
                        tick();
                    }, 650);
                    return function(){ clearTimeout(t); };
                }, function(){
                    logo.classList.remove('is-pending', 'is-typing');
                    logo.innerHTML = LOGO.split('').map(function(c, i){
                        return barSpan(c, i);
                    }).join('');
                });
            }

            // type into a .typed element with human-ish cadence
            function typeInto(el, text){
                var t;
                return step(function(finish){
                    el.classList.remove('is-pending');
                    el.classList.add('is-typing');
                    var i = 0;
                    function nextDelay(prev, curr){
                        var d = 55 + Math.random() * 90;
                        if(prev === ' ') d += 60 + Math.random() * 80;
                        if(curr === ' ') d += 30;
                        if(Math.random() < 0.05) d += 180 + Math.random() * 260;
                        return d;
                    }
                    function tick(){
                        if(i >= text.length){
                            el.classList.remove('is-typing');
                            finish();
                            return;
                        }
                        var prev = i > 0 ? text.charAt(i - 1) : '';
                        var curr = text.charAt(i);
                        el.textContent += curr;
                        i++;
                        t = setTimeout(tick, nextDelay(prev, curr));
                    }
                    tick();
                    return function(){ clearTimeout(t); };
                }, function(){
                    el.classList.remove('is-pending', 'is-typing');
                    el.textContent = text;
                });
            }

            // cursor parks blinking at the end of a line, then jumps to
            // the next empty line and blinks there — like pressing Enter.
            function lineBreak(prev, next){
                var t1, t2;
                return step(function(finish){
                    prev.classList.add('is-blinking');
                    t1 = setTimeout(function(){
                        prev.classList.remove('is-blinking', 'is-pending');
                        next.classList.add('is-pending');
                        t2 = setTimeout(finish, 520);
                    }, 380);
                    return function(){ clearTimeout(t1); clearTimeout(t2); };
                }, function(){
                    prev.classList.remove('is-blinking', 'is-pending');
                    next.classList.add('is-pending');
                });
            }

            // master sequence
            wait(400)
                .then(typeLogo)
                // Enter — cursor onto the empty line between logo and tagline
                .then(function(){ return lineBreak(logo, break1); })
                // Enter again — cursor onto the (still empty) tagline line
                .then(function(){ return lineBreak(break1, tagline); })
                .then(function(){ return typeInto(tagline, TAGLINE); })
                // Enter — onto empty line between tagline and contact
                .then(function(){ return lineBreak(tagline, break2); })
                // Enter again — onto the empty email line
                .then(function(){ return lineBreak(break2, email); })
                .then(function(){ return typeInto(email, EMAIL); })
                .then(function(){ return lineBreak(email, bizid); })
                .then(function(){ return typeInto(bizid, BIZID); })
                .then(function(){ return lineBreak(bizid, endLine); })
                .then(function(){
                    // final resting cursor stays blinking forever
                    return wait(700);
                })
                .then(function(){
                    footer.classList.add('is-visible');
                    // sequence over — further key presses do nothing
                    window.removeEventListener('keydown', requestSkip);
                    window.removeEventListener('pointerdown', requestSkip);
                });
        })();
    </script>
</body>
</html>
