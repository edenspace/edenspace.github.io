<!DOCTYPE html>
<html>
    <head>  
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css?family=Inconsolata|Libre+Barcode+128+Text" rel="stylesheet">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">
        <!-- Removed Bootstrap dependency: all layout and styles are implemented with custom CSS -->
        <title>Edenspace Oy</title>
        <style>
            /* Page basics */
            html, body {
                height: 100%;
                margin: 0;
            }

            body {
                background: #000; /* black background */
                color: #ffffff;
                font-family: "Inconsolata", monospace;
                text-align: center;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                font-size: 18px;
                display: flex;
                flex-direction: column;
            }

            /* Logo and tagline */
            .hero {
                flex: 1 0 auto; /* take available space */
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 0.5rem;
                padding: 2rem;
            }

            h1 {
                font-family: 'Libre Barcode 128 Text', monospace;
                font-size: 7rem;
                margin: 0;
                font-weight: normal;
            }

            .tagline {
                font-size: 1.25rem;
                color: #e6e6e6;
            }

            a {
                color: inherit;
                text-decoration: none;;
            }

            /* Footer anchored to the bottom */
            footer.site-footer {
                flex-shrink: 0;
                padding: 0.75rem 1rem;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 1.25rem;
                border-top: 1px solid rgba(255,255,255,0.06);
                background: rgba(0,0,0,0.9);
            }

            .site-footer .reliable-partner img {
                height: 4rem; /* larger logo — placed at very bottom */
                display: block;
                margin-top: 0.5rem;
            }

            .site-footer .meta {
                /* match the tagline style and stack lines vertically */
                font-family: "Inconsolata", monospace;
                font-size: 1.25rem;
                color: #e6e6e6;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.2rem;
                line-height: 1.15;
            }

            @media (max-width: 520px) {
                h1 { font-size: 2.6rem; }
                .tagline { font-size: 1rem; }
                .site-footer { flex-direction: column; gap: .5rem; padding: 0.75rem; }
                .site-footer .reliable-partner img { height: 2.6rem; }
            }
        </style>
    </head>
    <body>
        <main class="hero" role="main">
            <h1><a href="#">EDENSPACE</a></h1>
            <div class="tagline">a software development company</div>
        </main>

        <footer class="site-footer" role="contentinfo">
            <div class="meta">
                <div><a href="mailto:contact@edenspace.fi">contact@edenspace.fi</a></div>
                <div>2656910-7</div>
                <a class="reliable-partner" href="https://www.vastuugroup.fi/palvelut/luotettava-kumppani" title="Luotettava kumppani">
                    <img src="luotettava-kumppani-logo-white.png" alt="Luotettava kumppani logo (valkoinen)">
                </a>
            </div>
        </footer>
    </body>
</html>
