<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edenspace Oy</title>
    <link href="https://fonts.googleapis.com/css?family=Inconsolata|Libre+Barcode+128+Text" rel="stylesheet">
    <style>
        :root{
            --bg: #000;
            --fg: #fff;
            --muted: #e6e6e6;
            --max-width: 900px; /* maximum content width */
            --footer-height: 84px; /* fixed footer height */
            --footer-logo-h: 56px; /* fixed footer logo height (does NOT scale) */
        }

        html,body{height:100%;margin:0}
        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:stretch;
            background:var(--bg);
            color:var(--fg);
            font-family: "Inconsolata", monospace;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            /* fluid base font size */
            font-size: clamp(16px, 1.6vw, 18px);
        }

        main.hero{
            flex:1 0 auto;
            display:flex;
            align-items:center;
            justify-content:center;
            padding: clamp(1rem, 6vw, 2.5rem) 1rem;
        }

        .content{
            width: min(92vw, var(--max-width));
            text-align:center;
        }

        /* logo text (non-semantic div, not bold) */
        .logo-text{
            margin:0;
            font-family: 'Libre Barcode 128 Text', monospace;
            /* allow EDENSPACE to grow almost full width on narrow screens */
            font-size: clamp(2.8rem, 22vw, 8rem);
            line-height:1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400; /* explicitly not bold */
        }

        .tagline{
            margin-top: clamp(.5rem, 1.6vw, .85rem);
            color: var(--muted);
            font-size: clamp(1rem, 2.4vw, 1.25rem);
        }

        .contact{
            /* more space above the email */
            margin-top: clamp(1rem, 4vw, 1.5rem);
            display:flex;
            flex-direction:column;
            gap: clamp(.15rem, .8vw, .4rem);
            align-items:center;
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            color: var(--muted);
        }

        .contact a{ color:inherit; text-decoration:none }

        footer.site-footer{
            height: var(--footer-height);
            display:flex;
            align-items:center;
            justify-content:center;
            background: rgba(0,0,0,0.9);
            flex-shrink:0;
        }

        /* Footer image is fixed size and does NOT scale */
        .site-footer .reliable-partner img{
            height: var(--footer-logo-h);
            width: auto;
            display:block;
        }

    </style>
</head>
<body>
    <main class="hero" role="main">
        <div class="content">
            <div class="logo-text">EDENSPACE</div>
            <div class="tagline">a software development company</div>
            <div class="contact" aria-label="contact details">
                <div><a href="mailto:contact@edenspace.fi">contact@edenspace.fi</a></div>
                <div>2656910-7</div>
            </div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="reliable-partner" aria-hidden="false">
            <img src="luotettava-kumppani-logo-white.png" alt="Luotettava kumppani">
        </div>
    </footer>
</body>
</html>
