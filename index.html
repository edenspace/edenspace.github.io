<!DOCTYPE html>
<html>
    <head>  
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css?family=Inconsolata|Libre+Barcode+128+Text" rel="stylesheet">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">    
        <title>Edenspace Oy</title>
        <style>
            body {
                background: white;
                font-family: "Inconsolata";
                position: relative;
                color: #5d5d5d;
                text-align: center;
                font-size: 150%;
            }

            h1 {
                font-family: 'Libre Barcode 128 Text';
                font-size: 5em;
            }

            h2 {
                font-size: 2em;
                padding: 1em 0 0.5em;
                margin: 0;
            }

            h3 {
                font-size: 1.25em;
                font-weight: bold;
                margin: 0.75em 0;
            }

            a {
                color: #5d5d5d;
            }

            .page {
                min-height: 100vh;
            }

            #intro {
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            	background: black;
                color: white;
            }

            #intro a {
                color: white;
                text-decoration: none;
            }

            #intro code {
                font-size: 80%;
                color: #666666;
            }
            
            @media only screen and (max-width: 500px) {
                body {
                    font-size: 100%;
                }
            }
            
            .content {
                align-items: center;
                display: flex;
                justify-content: space-around;
            }

            .reliable-partner img {
                height: 2.5em;
            }
            

        </style>
    </head>
    <body>
        <div class="page" id="intro">
            <div class="intro-container">
                <h1><a href="#about">EDENSPACE</a></h1>
                <code class="mt-4 pr-2">a software development company</code>
            </div>
        </div>      

        <div class="page d-flex flex-column">
            <div class="content flex-grow-1" id="about">
                <div class="contact">
                    <div><a href="mailto:contact@edenspace.fi">contact@edenspace.fi</a></div>
                    <div><a href="tel:+358505000094">+358 50 5000 094</a></div>
                    <span title="business id">2656910-7<span></span>
                </div>
            </div>
            <div class="reliable-partner" title="Reliable partner"><a href="http://tilaajavastuu.fi"><img src="reliablepartner.png"/></a></div>
        </div>    
        
        <script src="https://code.jquery.com/jquery-3.1.1.min.js" integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=" crossorigin="anonymous"></script>
        <script>
            $(document).ready(function() {
                // smooth scroll
                $(document).on('click', 'a', function(event){
                    var $link = $(this);
                    var href = $link.attr('href');
                    if ( href.indexOf("#") >= 0 ) {
                        event.preventDefault();
                        $link.blur();
                        $('html, body').animate({
                            scrollTop: $( $link.attr('href') ).offset().top
                        }, 500);
                    }
                });
            });
        </script>
        

    </body>
</html>
